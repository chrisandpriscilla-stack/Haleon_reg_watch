name: Extract Haleon emissions data

on:
  push:
    branches:
      - claude/haleon-emissions-chart-126jlz

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pypdf
        run: pip install --quiet pypdf

      - name: Download PDFs
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          dl () {
            curl -sS -L --compressed -o "$1" \
              -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
              -H 'Accept-Language: en-GB,en;q=0.9' \
              -H 'Referer: https://www.haleon.com/our-impact/esg-reporting-hub' \
              -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: same-origin' \
              -H 'Upgrade-Insecure-Requests: 1' \
              -w "%{http_code} %{size_download} $1\n" "$2" || echo "curl failed for $1"
          }
          dl databook2025.pdf 'https://www.haleon.com/content/dam/haleon/corporate/documents/our-impact/2025/2025-ESG-Databook.pdf'
          dl catp2025.pdf 'https://www.haleon.com/content/dam/haleon/corporate/documents/our-impact/2025/Climate-Action-Transition-Plan.pdf'
          ls -la *.pdf || true
          file *.pdf || true

      - name: Extract emissions pages
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          DOCS = [("DATABOOK-2025", "databook2025.pdf", range(10, 19)),
                  ("CATP-2025", "catp2025.pdf", range(4, 9))]

          for name, path, pages in DOCS:
              print("=" * 25, name, "=" * 25, flush=True)
              try:
                  reader = PdfReader(path)
                  print(f"[pages in doc: {len(reader.pages)}]", flush=True)
                  for i in pages:
                      if i < len(reader.pages):
                          print(f"\n----- {name} page index {i} (printed page ~{i+1}) -----", flush=True)
                          print(reader.pages[i].extract_text(), flush=True)
              except Exception as e:
                  print(f"FAILED {name}: {e!r}", flush=True)
          PY
